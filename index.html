<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a222c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Trip Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-text">
        <h1 id="trip-title">Trip Map</h1>
        <p class="subtitle" id="trip-subtitle"></p>
      </div>
    </header>

    <div class="glider" id="glider">
      <p id="glider-date">Thu 12 Nov, 00:00</p>
      <button type="button" id="glider-play" aria-label="Play">▶</button>
      <input id="glider-range" type="range" aria-label="Trip date" />
    </div>

    <div class="main">
      <div id="map" role="application" aria-label="Trip route map"></div>

      <aside
        id="detail-panel"
        class="detail-panel"
        hidden
        aria-label="Stop details"
        aria-live="polite"
      >
        <div class="detail-header">
          <div>
            <p class="detail-kicker" id="detail-country"></p>
            <h2 id="detail-city"></h2>
            <p class="detail-dates" id="detail-dates"></p>
            <p class="detail-stay" id="detail-stay"></p>
          </div>
          <button type="button" class="btn close" id="detail-close" aria-label="Close panel">×</button>
        </div>

        <div class="detail-body" id="detail-body"></div>

        <div class="detail-footer" id="detail-footer">
          <span class="save-status" id="save-status">Edits stay on this device only</span>
          <button type="button" class="btn primary" id="btn-save">Save</button>
        </div>
      </aside>
    </div>

    <p class="map-hint" id="map-hint">Tap a numbered marker for stop details</p>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="data/trip.js?v=6"></script>
    <script src="data/faces.js?v=6"></script>
    <script src="app.js?v=6"></script>
  </body>
</html>
